version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskportal-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taskportal-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_EXPIRATION_MS: "3600000"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    container_name: taskportal-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
